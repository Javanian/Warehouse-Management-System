name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STOCKFLOW_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/stockflow_test
      STOCKFLOW_TEST_DB_USER: stockflow_test
      STOCKFLOW_TEST_DB_PASSWORD: ci-test-only
      AGENT_DB_USERNAME: stockflow_agent
      AGENT_DB_PASSWORD: ci-agent-only

    steps:
      - uses: actions/checkout@v4

      - name: Prepare disposable test databases
        env:
          PGPASSWORD: ci-superuser
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role stockflow_test login password 'ci-test-only';
          create role stockflow_agent login noinherit password 'ci-agent-only';
          grant stockflow_agent to stockflow_test with admin option;
          create database stockflow_test owner stockflow_test;
          create database stockflow_test_unmarked owner stockflow_test;
          comment on database stockflow_test is 'stockflow:disposable-test';
          SQL

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/extraction-spike/requirements.txt

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r tools/extraction-spike/requirements.txt

      - name: Synthetic data and extraction evaluator tests
        run: python -m unittest tools/synthetic/test_generator.py tools/synthetic/test_rendered_documents.py tools/extraction-spike/test_benchmark.py

      - name: Frontend install, unit tests, build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Backend tests and package with frontend
        working-directory: backend
        run: ./mvnw -B -Pwith-frontend verify

      - uses: actions/upload-artifact@v4
        with:
          name: stockflow-jar
          path: backend/target/stockflow-backend.jar
