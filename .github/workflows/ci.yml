name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockflow_test
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw -B test
        working-directory: backend
        env:
          STOCKFLOW_TEST_DB_URL: jdbc:postgresql://localhost:5432/stockflow_test
          STOCKFLOW_TEST_DB_USERNAME: stockflow
          STOCKFLOW_TEST_DB_PASSWORD: testpassword

  frontend:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run unit tests
        run: npx vitest run
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend
