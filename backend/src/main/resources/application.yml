spring:
  application:
    name: stockflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/stockflow}
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 10000
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${APP_PORT:8085}
  address: ${APP_BIND:127.0.0.1}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SF_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO

stockflow:
  bootstrap-admin-password: ${STOCKFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  business-timezone: Asia/Jakarta
  lock-timeout-ms: 5000
  login:
    max-failures: 5
    window-minutes: 5
  demo:
    seed: false
