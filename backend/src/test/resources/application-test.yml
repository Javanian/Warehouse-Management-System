spring:
  datasource:
    url: ${STOCKFLOW_TEST_DB_URL:jdbc:postgresql://127.0.0.1:55432/stockflow_test}
    username: ${STOCKFLOW_TEST_DB_USER:stockflow_test}
    password: ${STOCKFLOW_TEST_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
  flyway:
    clean-disabled: false

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false

stockflow:
  demo:
    seed: false
  lock-timeout-ms: 5000
  login:
    max-failures: 5
    window-minutes: 5
